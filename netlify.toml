# Netlify reads this on every push: no build step, publish the site/ folder as it is.
[build]
  publish = "site"
  command = ""

# Private pipeline API (see netlify/functions/pipeline.mjs). Bundled with esbuild so it can
# import data/pipeline-feed.json, which lives outside site/ and is never published as a page.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
